# Verifies that the public desktop source builds without proprietary artwork.
name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

env:
  # Pinned public engine revision used by the desktop Cargo path dependencies.
  FRAMESHIFT_PUBLIC_SHA: b031735284994c20b9c4ed93c44231cbb1394e65

jobs:
  verify:
    name: Verify public source
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout FrameShift Desktop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: frameshift-desktop

      - name: Checkout FrameShift engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ghost-Frame/FrameShift
          ref: ${{ env.FRAMESHIFT_PUBLIC_SHA }}
          path: frameshift

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frameshift-desktop/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frameshift-desktop/desktop/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88.0

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            frameshift-desktop/desktop/src-tauri -> target
            frameshift -> target

      - name: Install dependencies
        working-directory: frameshift-desktop/desktop
        run: pnpm install --frozen-lockfile

      - name: Test interface and release tooling
        working-directory: frameshift-desktop
        run: |
          pnpm test
          node --test \
            desktop/scripts/build-latest-json.test.mjs \
            desktop/scripts/sync-audio-assets.test.mjs \
            desktop/scripts/verify-csp.test.mjs

      - name: Typecheck interface
        working-directory: frameshift-desktop
        run: pnpm typecheck

      - name: Build interface without proprietary artwork
        working-directory: frameshift-desktop
        run: pnpm build

      - name: Check native application
        working-directory: frameshift-desktop
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
